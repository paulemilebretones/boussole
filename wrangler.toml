name = "boussole"
compatibility_date = "2024-11-01"
main = "worker.js"

# Sert les fichiers statiques (index.html = l'appli) ; le Worker ci-dessus
# n'intervient que pour /api/cours (les cours en direct).
[assets]
directory = "."
binding = "ASSETS"

# Toutes les heures : verifie les alertes de prix et envoie les notifs.
# Les rappels d'achat ne partent qu'a 7h UTC (~9h Paris), filtre dans le handler scheduled.
[triggers]
crons = ["0 * * * *"]
